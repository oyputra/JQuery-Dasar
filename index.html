<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar JQuery</title>
    <style>
        .container {
            width: 1100px;
            margin: 0 auto;
        }
        img {
            width: 100%; 
            height: 400px;
            object-fit: cover;
            transform: rotate(180deg); 
        }
    </style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="jquery.js"></script>
</head>
<body>
    <div class="container">
        <img src="ramadan.jpg" alt="">
        <h1>Belajar JQuery!!</h1>
        <div id="box1">Box 1</div>

        <form id="boxes_wrap">
            <div class="boxes">Baris Pertama</div>
            <div class="boxes">Baris Kedua</div>
            <div class="boxes">Baris Antara Kedua dan Ketiga</div>
            <div class="boxes">Baris Ketiga</div>
            <input type="submit" value="Change">
        </form>

        <form action="">
            <input type="text" id="inputText">
            <input type="submit">
        </form>
    </div>
</body>
<script>
    // memastikan file sudah diload dengan sempurna
    $(document).ready(function(){
        // selection
        $('h1').css('color', 'blue');
        $('#box1').css('color', 'blue');
        $('.boxes').css('color', 'blue');

        $('.boxes:first').css('color', 'orange');
        $('.boxes:last').css('color', 'green');
        $('.boxes:eq(2)').css('color', 'aqua');

        // event
        $('h1').click(function(){
            $('h1').css('color', 'red');
        });
        $('h1').mouseenter(function(){
            $('h1').css('color', 'yellow');
        });
        $('h1').mouseleave(function(){
            $('h1').css('color', 'green');
        });
        $('.boxes').mouseenter(function(){
            $(this).css('color', 'yellow');
        });

        // get dan set nilai
        $('form').submit(function(){
            var tulisan = $('#inputText').val();
            $('h1').text(tulisan);

            // mencegah reload/sifat
            event.preventDefault();
        });

        $('#boxes_wrap').submit(function(){
            $('#boxes_wrap').html("<b>Data Terubah!</b>");
            event.preventDefault();
        });
    });
</script>
</html>
