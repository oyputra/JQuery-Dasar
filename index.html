<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar JQuery</title>
    <style>
        .container {
            width: 1100px;
            margin: 0 auto;
        }
        img {
            width: 100%; 
            height: 400px;
            object-fit: cover;
            transform: rotate(180deg); 
        }
        #boxes_wrap {
            background: gray;
            width: 100px;
            height: 100px;
            padding: 10px;
            border: 5px solid black;
            margin: 10px;
        }
        .change {
            background: yellow;
            color: white;
        }
        .change-remove {
            background: gray;
            color: black;
        }
        .mt-5 {
            margin-top: 50px;
        }
        #box2 {
            height: 100px;
            width: 100px;
            background-color: grey;
        }
    </style>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="jquery.js"></script>
</head>
<body>
    <div class="container">
        <img src="ramadan.jpg" alt="">
        <h1>Belajar JQuery!!</h1>
        <div id="box1">Box 1</div>

        <form id="boxes_wrap">
            <div class="boxes">Baris Pertama</div>
            <div class="boxes">Baris Kedua</div>
            <div class="boxes">Baris Antara Kedua dan Ketiga</div>
            <div class="boxes">Baris Ketiga</div>
            <input type="submit" value="Change">
        </form>

        <form action="">
            <input type="text" id="inputText">
            <input type="submit">
        </form>
    </div>

    <div class="container mt-5">
        <div id="box2">Box 2</div>
        <br>
        <button id="btn1">Show</button>
        <button id="btn2">Hide</button>
        <button id="btn3">Toggle</button>
        <br>
        <br>
        <button id="btn4">Fade In</button>
        <button id="btn5">Fade Out</button>
        <button id="btn6">Fade Toggle</button>
        <button id="btn7">Fade To 0.5</button>
        <button id="btn8">Fade To 1</button>
        <br>
        <br>
        <button id="btn9">Slide Down</button>
        <button id="btn10">Slide Up</button>
        <button id="btn11">Slide Toggle</button>

    </div>
</body>
<script>
    // memastikan file sudah diload dengan sempurna
    $(document).ready(function(){
        // selection
        // $('h1').css('color', 'blue');
        $('#box1').css('color', 'blue');
        $('.boxes').css('color', 'blue');

        $('.boxes:first').css('color', 'orange');
        $('.boxes:last').css('color', 'green');
        $('.boxes:eq(2)').css('color', 'aqua');

        // event | mutliple css
        $('h1').click(function(){
            // $('h1').css({
            //     'color': 'white',
            //     'fontSize': '50px',
            //     'backgroundColor': 'lightblue'
            // });

            // add & remove class
            // $('h1').addClass('change');
            // $('h1').removeClass('change-remove');
            
            // toggle class
            $('h1').toggleClass('change');
            
        });
        // $('h1').mouseenter(function(){
        //     $('h1').css('color', 'yellow');
        // });
        // $('h1').mouseleave(function(){
        //     $('h1').css('color', 'green');
        // });
        // $('.boxes').mouseenter(function(){
        //     $(this).css('color', 'yellow');
        // });

        // get dan set nilai
        $('form').submit(function(){
            var tulisan = $('#inputText').val();
            $('h1').text(tulisan);

            // mencegah reload/sifat
            event.preventDefault();
        });

        $('#boxes_wrap').submit(function(){
            $('#boxes_wrap').html("<b>Data Terubah!</b>");
            event.preventDefault();
        });

        // menambahkan dan menghapus
        // append & prepend (di dalam elemen) | after & before (di luar elemen)
        $('#boxes_wrap').append('<div>ini Append</div>');
        $('#boxes_wrap').prepend('<div>ini Prepend</div>');
        $('#boxes_wrap').before('<div>ini Before</div>');
        $('#boxes_wrap').after('<div>ini After</div>');

        // remove & empty
        $('.boxes:eq(2)').remove();
        $('.boxes:eq(1)').empty();

        // dimensi
        /*
            width       -> kontent
            innerWidth  -> kontent + padding
            outerWidth  -> kontent + padding + border
            (true)      -> + margin  
        */
        // var nilai = $('#boxes_wrap').innerWidth();
        var nilai = $('#boxes_wrap').outerWidth(true);
        $('#box1').text(nilai);

        // ubah nilai dimensi
        $('#boxes_wrap').height(300).width(400);

        // hide & show & toggle
        $('#btn1').click(function() {
            $('#box2').show();
        }) 
        $('#btn2').click(function() {
            $('#box2').hide();
        }) 
        $('#btn3').click(function() {
            $('#box2').toggle();
        }) 

        // fadeIn & fadeOut & fadeToggle & fadeTo(Time, Opacity)
        $('#btn4').click(function() {
            $('#box2').fadeIn();
        }) 
        $('#btn5').click(function() {
            $('#box2').fadeOut();
        }) 
        $('#btn6').click(function() {
            $('#box2').fadeToggle();
        }) 
        $('#btn7').click(function() {
            $('#box2').fadeTo(2000, 0.5);
        }) 
        $('#btn8').click(function() {
            $('#box2').fadeTo(2000, 1);
        }) 
        $('#btn9').click(function() {
            $('#box2').slideDown(2000);
        }) 
        $('#btn10').click(function() {
            $('#box2').slideUp(2000);
        }) 
        $('#btn11').click(function() {
            $('#box2').slideToggle(2000);
        }) 

    });
</script>
</html>
